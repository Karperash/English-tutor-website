services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE}
    volumes:
      - ./:/var/www/html
    command: >
      bash -lc "composer install --no-interaction --prefer-dist --optimize-autoloader
      && mkdir -p storage/homework
      && chown -R www-data:www-data storage
      && apache2-foreground"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
